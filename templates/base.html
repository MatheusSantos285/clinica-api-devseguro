<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Agendamento - Clínica Médica</title>
    <!-- Utilizando Bootstrap via CDN para estilização limpa -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <header class="bg-primary text-white text-center py-3 mb-4 shadow-sm">
        <h1 class="h3 mb-0">Sistema de Agendamento - Clínica Médica</h1>
    </header>

    <main class="container">
        <!-- Bloco Dinâmico para injeção de conteúdo das páginas filhas -->
        {% block content %}{% endblock %}
    </main>

    <footer class="container text-center mt-5 py-4 border-top text-muted">
        <p class="mb-0 small">
            <strong>Aviso de Confidencialidade (LGPD):</strong>
            Esta visão operacional não exibe dados médicos sensíveis.
            Informações restritas estão disponíveis apenas no prontuário interno.
        </p>
    </footer>

</body>
</html>
